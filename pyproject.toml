[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-runner"
version = "0.1.0"
description = "Run Java Spring Boot projects from the terminal and classify startup results."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "app-runner contributors" }]
dependencies = []

[project.scripts]
app-runner = "app_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
